name: Build Clearcut

on:
  push:
    branches: [main]
    paths-ignore: ['QA/**', 'tools/make_icon.py', 'tools/fetch_backgrounds.py', 'docs/**', 'Package.swift', '.github/workflows/quality.yml', '.github/workflows/backgrounds.yml', 'README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cutout model cache
        uses: actions/cache@v4
        with:
          path: Clearcut/Model
          key: birefnet-lite-fp16-r1-db2e2a42

      - name: Fetch cutout model (verified)
        run: tools/fetch_model.sh Clearcut/Model/BiRefNetLite.mlpackage


      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project Clearcut.xcodeproj \
            -scheme Clearcut \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:" build.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | grep -v "appintentsmetadataprocessor" | sort -u | head -40 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Clearcut.app Payload/
          zip -qr Clearcut.ipa Payload

      # Mathew's own version: the same app plus listings written by Gemini (PERSONAL flag).
      # Not for the App Store. Same bundle id, so it installs over the store version.
      - name: Build personal app
        run: |
          xcodebuild \
            -project Clearcut.xcodeproj \
            -scheme Clearcut \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-personal \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=PERSONAL \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-personal.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:" build-personal.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build-personal.log
              exit 1
            }

      - name: Package personal IPA
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build-personal/Build/Products/Release-iphoneos/Clearcut.app Payload/
          zip -qr Clearcut-personal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Clearcut
          path: |
            Clearcut.ipa
            Clearcut-personal.ipa

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Clearcut.ipa Clearcut-personal.ipa \
            --title "Clearcut build ${{ github.run_number }}" \
            --notes "Clearcut-personal.ipa is Mathew's own version, with listings written by Gemini. Clearcut.ipa is the App Store version, without listings. Install either with SideStore."
