name: Build Clearcut

on:
  # Experimental branch: builds only Mathew's personal app, released as "experimental".
  push:
    branches: [experimental-cutout]
    paths-ignore: ['QA/**', 'tools/make_icon.py', 'tools/fetch_backgrounds.py', 'docs/**', 'Package.swift', '.github/workflows/quality.yml', '.github/workflows/backgrounds.yml', 'README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Apple requires uploads built with Xcode 26 and the iOS 26 SDK. Pinned so a new default
      # Xcode on GitHub's machine can't change the build without a commit here.
      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cutout model cache
        uses: actions/cache@v4
        with:
          path: Clearcut/Model
          key: birefnet-lite-fp16-r1-db2e2a42

      - name: Fetch cutout model (verified)
        run: tools/fetch_model.sh Clearcut/Model/BiRefNetLite.mlpackage


      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Mathew's own version: the same app plus listings written by Gemini (PERSONAL flag).
      # Not for the App Store. Its own bundle id and name ("My Clearcut"), so it installs next to
      # the store version and both can be tested on one phone.
      - name: Build personal app
        run: |
          xcodebuild \
            -project Clearcut.xcodeproj \
            -scheme Clearcut \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-personal \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=PERSONAL \
            PRODUCT_BUNDLE_IDENTIFIER=app.clearcut.photos.personal APP_DISPLAY_NAME="My Clearcut Lab" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-personal.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:" build-personal.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build-personal.log
              exit 1
            }

      - name: Package personal IPA
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build-personal/Build/Products/Release-iphoneos/Clearcut.app Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" Payload/Clearcut.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Clearcut.app/Info.plist
          zip -qr Clearcut-personal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Clearcut-experimental
          path: Clearcut-personal.ipa

      - name: Publish as the experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete experimental --yes --cleanup-tag || true
          gh release create experimental Clearcut-personal.ipa \
            --target "${{ github.sha }}" --prerelease \
            --title "Clearcut experimental build ${{ github.run_number }}" \
            --notes "Experimental cutout engine (branch experimental-cutout). Installs over My Clearcut (same app ID) and shows as My Clearcut Lab. To go back, install Clearcut-personal.ipa from the latest release."
