name: Build Clearcut

on:
  push:
    branches: [main]
    paths-ignore: ['QA/**', 'tools/**', 'docs/**', 'Package.swift', '.github/workflows/quality.yml', '.github/workflows/backgrounds.yml', 'README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project Clearcut.xcodeproj \
            -scheme Clearcut \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:" build.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | grep -v "appintentsmetadataprocessor" | sort -u | head -40 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Clearcut.app Payload/
          zip -qr Clearcut.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Clearcut
          path: Clearcut.ipa

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Clearcut.ipa \
            --title "Clearcut build ${{ github.run_number }}" \
            --notes "Open this page on your iPhone, download Clearcut.ipa and open it with SideStore to install or update."
