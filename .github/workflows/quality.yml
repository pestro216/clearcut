name: Image quality

on:
  push:
    branches: [main]
    paths: ['Core/**', 'QA/**', 'Package.swift', '.github/workflows/quality.yml']
  workflow_dispatch:

jobs:
  quality:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Apple requires uploads built with Xcode 26 and the iOS 26 SDK. Pinned so a new default
      # Xcode on GitHub's machine can't change the build without a commit here.
      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cutout model cache
        uses: actions/cache@v4
        with:
          path: Clearcut/Model
          key: birefnet-lite-fp16-r1-db2e2a42

      - name: Fetch cutout model (verified)
        run: tools/fetch_model.sh Clearcut/Model/BiRefNetLite.mlpackage


      - name: Unit tests
        run: |
          swift test 2>&1 | tail -60
          exit ${PIPESTATUS[0]}

      - uses: actions/cache@v4
        with:
          path: QA/.texture_cache
          key: textures-v1

      - name: Build ground-truth scenes
        run: |
          python3 -m pip install --quiet --break-system-packages numpy pillow scipy 2>/dev/null || python3 -m pip install --quiet numpy pillow scipy
          python3 QA/make_testset.py "$RUNNER_TEMP/testset"
          python3 QA/real_scenes.py "$RUNNER_TEMP/testset"

      - uses: actions/cache@v4
        with:
          path: QA/.webset
          key: webset-v1-${{ hashFiles('QA/fetch_webset.py') }}
          restore-keys: webset-v1-

      - name: Fetch varied web test photos (openly licensed)
        run: python3 QA/fetch_webset.py QA/.webset 2 || true

      - name: Benchmark
        id: bench
        run: |
          swift build -c release --product cutbench 2>&1 | tail -20
          set +e
          CLEARCUT_MODEL="$GITHUB_WORKSPACE/Clearcut/Model/BiRefNetLite.mlpackage" .build/release/cutbench "$RUNNER_TEMP/testset" qa_out QA/.webset | tee qa_out/log.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cp QA/.webset/manifest.json qa_out/web_credits.json 2>/dev/null || true

      - name: Publish report to the qa-results branch
        if: always()
        run: |
          cp "$RUNNER_TEMP/testset/01_navy_shirt_on_white/photo.jpg" qa_out/scene_01_photo.jpg 2>/dev/null || true
          QA/publish.sh qa_out "latest" "Quality run ${{ github.run_number }}"
          QA/publish.sh qa_out "runs/${{ github.run_number }}" "Quality run ${{ github.run_number }} archive"

      - name: Fail on regression
        if: steps.bench.outputs.status != '0'
        run: exit 1
