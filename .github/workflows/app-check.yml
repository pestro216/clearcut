name: App check on simulator

on:
  push:
    branches: [main]
    paths: ['Clearcut/**', 'Core/**', 'QA/AppTests/**', 'project.yml', '.github/workflows/app-check.yml']
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Apple requires uploads built with Xcode 26 and the iOS 26 SDK. Pinned so a new default
      # Xcode on GitHub's machine can't change the build without a commit here.
      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cutout model cache
        uses: actions/cache@v4
        with:
          path: Clearcut/Model
          key: birefnet-lite-fp16-r1-db2e2a42

      - name: Fetch cutout model (verified)
        run: tools/fetch_model.sh Clearcut/Model/BiRefNetLite.mlpackage

      - name: Build for the simulator
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild -project Clearcut.xcodeproj -scheme Clearcut -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | head -40; exit 1; }
      - uses: actions/cache@v4
        with:
          path: QA/.texture_cache
          key: textures-v1
      - name: Test photos
        run: |
          python3 -m pip install --quiet --break-system-packages numpy pillow scipy 2>/dev/null || python3 -m pip install --quiet numpy pillow scipy
          python3 QA/make_testset.py "$RUNNER_TEMP/testset" > /dev/null
          mkdir -p "$RUNNER_TEMP/demo"
          for d in 01_navy_shirt_on_white 04_watch_thin_straps 06_mug_handle_gap 07_reflective_bottle 05_fine_chain_on_marble 10_comb_narrow_teeth; do cp "$RUNNER_TEMP/testset/$d/photo.jpg" "$RUNNER_TEMP/demo/$d.jpg"; done
      - name: Launch, load a batch, take screenshots (iPhone, then iPad)
        run: |
          set -x
          mkdir -p shots
          APP=$(find build/Build/Products/Debug-iphonesimulator -name Clearcut.app -maxdepth 1)
          # The newest iOS runtime's plain model of a kind (iPhone 17, iPad (A16) on Xcode 26),
          # else any device of that kind on it.
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          kind = sys.argv[1]
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k and d[k]), key=lambda k: [int(n) for n in re.findall(r'\d+', k.split('iOS')[-1])])
          devs = [x for x in d[ios[-1]] if x['name'].startswith(kind)]
          plain = [x for x in devs if re.fullmatch(kind + r' (\d+|\(A\d+\))', x['name'])]
          print((plain or devs)[0]['udid'])" "$1"
          }
          # shoot DEVICE PREFIX: four screenshots and the app's errors, named PREFIX1_home.png and so on.
          shoot() {
            DEV="$1"; P="$2"
            xcrun simctl boot "$DEV"
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl launch "$DEV" app.clearcut.photos; sleep 6
            xcrun simctl io "$DEV" screenshot "shots/${P}1_home.png"
            xcrun simctl terminate "$DEV" app.clearcut.photos
            SIMCTL_CHILD_CLEARCUT_DEMO_DIR="$RUNNER_TEMP/demo" xcrun simctl launch "$DEV" app.clearcut.photos; sleep 75
            xcrun simctl io "$DEV" screenshot "shots/${P}2_batch.png"
            xcrun simctl terminate "$DEV" app.clearcut.photos
            SIMCTL_CHILD_CLEARCUT_DEMO_DIR="$RUNNER_TEMP/demo" SIMCTL_CHILD_CLEARCUT_DEMO_TOOL=background xcrun simctl launch "$DEV" app.clearcut.photos; sleep 90
            xcrun simctl io "$DEV" screenshot "shots/${P}3_background.png"
            xcrun simctl terminate "$DEV" app.clearcut.photos
            SIMCTL_CHILD_CLEARCUT_DEMO_DIR="$RUNNER_TEMP/demo" SIMCTL_CHILD_CLEARCUT_DEMO_TOOL=shadow xcrun simctl launch "$DEV" app.clearcut.photos; sleep 90
            xcrun simctl io "$DEV" screenshot "shots/${P}4_shadow.png"
            xcrun simctl terminate "$DEV" app.clearcut.photos
            SIMCTL_CHILD_CLEARCUT_DEMO_UNLOCK=1 xcrun simctl launch "$DEV" app.clearcut.photos; sleep 8
            xcrun simctl io "$DEV" screenshot "shots/${P}5_unlock.png"
            xcrun simctl spawn "$DEV" log show --last 6m --predicate 'process == "Clearcut"' --style compact 2>/dev/null | grep -iE "error|crash|fault" | tail -40 > "shots/${P}log.txt" || true
            xcrun simctl shutdown "$DEV"
          }
          shoot "$(pick iPhone)" ""
          shoot "$(pick iPad)" "ipad_"
      - name: Publish screenshots
        if: always()
        run: QA/publish.sh shots "app-check" "App check ${{ github.run_number }}"
      # The unlock purchase, bought, restored and refunded against Apple's local test store
      # (QA/AppTests/Clearcut.storekit). No developer account or real money involved.
      - name: App tests (unlock purchase)
        run: |
          xcodebuild test -project Clearcut.xcodeproj -scheme Clearcut \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build-test CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || {
              grep -E "error:|failed|XCTAssert" test.log | sort -u | head -40
              tail -30 test.log
              exit 1
            }
          grep -E "Test Case .* (passed|failed)|Executed" test.log | tail -8

