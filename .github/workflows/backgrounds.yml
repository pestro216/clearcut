name: Background library

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview (contact sheet only) or final (commit library)
        default: preview

jobs:
  backgrounds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_backgrounds.py ${{ github.event.inputs.mode }}
      - if: github.event.inputs.mode == 'preview'
        run: |
          git config user.name "Clearcut build"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin qa-results || true
          mkdir -p /tmp/out && cp -r bg_preview /tmp/out/
          git checkout --orphan qa-tmp
          git rm -rq --cached . || true
          rm -rf ./*  .github tools 2>/dev/null || true
          if git ls-remote --exit-code origin qa-results >/dev/null; then git checkout -q -f origin/qa-results -- . 2>/dev/null || true; fi
          rm -rf bg_preview && cp -r /tmp/out/bg_preview .
          git add -A && git commit -qm "Background preview" && git push -f origin HEAD:qa-results
      - if: github.event.inputs.mode == 'final'
        run: |
          git config user.name "Clearcut build"
          git config user.email "actions@users.noreply.github.com"
          git add Clearcut/Backdrops
          git commit -m "Background library: CC0 photographic surfaces" || echo "nothing to commit"
          git push
