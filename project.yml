name: Clearcut
options:
  bundleIdPrefix: app.clearcut
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Clearcut:
    type: application
    platform: iOS
    sources:
      - Clearcut
      - Core
    info:
      path: Clearcut/Info.plist
      properties:
        CFBundleDisplayName: Clearcut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Clearcut saves your finished photos to your library.
        NSCameraUsageDescription: Clearcut's camera photographs your items one after another for cutting out. Photos stay on your phone.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).batch
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Woolfall. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clearcut.photos
        TARGETED_DEVICE_FAMILY: "1"
        # Apple Intelligence (iOS 26 only) must not stop the app opening on iOS 17 and 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
