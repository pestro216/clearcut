name: Clearcut
options:
  bundleIdPrefix: app.clearcut
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The name under the icon and in the app's own text. Change it here when the store name is chosen.
    APP_DISPLAY_NAME: Clearcut
targets:
  Clearcut:
    type: application
    platform: iOS
    sources:
      - Clearcut
      - Core
    info:
      path: Clearcut/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: upright only and always full screen for now, because the camera and its level
        # are written for an upright device. (Apple is phasing out full-screen-only on iPad.)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        NSPhotoLibraryAddUsageDescription: $(APP_DISPLAY_NAME) saves your finished photos to your library.
        NSCameraUsageDescription: $(APP_DISPLAY_NAME)'s camera photographs your items one after another for cutting out. Photos stay on your phone.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).batch
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Woolfall. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clearcut.photos
        TARGETED_DEVICE_FAMILY: "1,2"
        # Apple Intelligence (iOS 26 only) must not stop the app opening on iOS 17 and 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - ClearcutTests
      storeKitConfiguration: QA/AppTests/Clearcut.storekit
  # Checks of the app itself on a simulator (the unlock purchase, against Apple's local test store).
  ClearcutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QA/AppTests
        excludes: ["*.storekit"]
      - path: QA/AppTests/Clearcut.storekit
        buildPhase: resources
    dependencies:
      - target: Clearcut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
